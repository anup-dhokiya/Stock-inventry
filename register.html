<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PoCkEtWoRld — Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/assets/auth.css" />
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow glow-1"></div><div class="bg-glow glow-2"></div><div class="bg-glow glow-3"></div>

  <div class="auth-container">
    <div class="auth-logo">
      <div class="logo-globe">🌍</div>
      <span class="logo-text"><span class="p">P</span><span class="o1">o</span><span class="c">C</span><span class="k">k</span><span class="e1">E</span><span class="t">t</span><span class="w">W</span><span class="o2">o</span><span class="r">R</span><span class="l">l</span><span class="d">D</span></span>
    </div>

    <div class="auth-card">
      <div class="auth-header"><h1>Create Account</h1><p>Join PoCkEtWoRld — Your Inventory World</p></div>

      <div id="errorMsg" class="error-msg" style="display:none;"><i class="fa-solid fa-circle-exclamation"></i><span id="errorText"></span></div>
      <div id="successMsg" class="success-msg" style="display:none;"><i class="fa-solid fa-circle-check"></i><span id="successText"></span></div>

      <form id="registerForm" class="auth-form">
        <div class="form-group"><label for="name"><i class="fa-solid fa-user"></i> Full Name</label><input type="text" id="name" placeholder="Enter your full name" required /></div>
        <div class="form-group"><label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label><input type="email" id="email" placeholder="you@example.com" required autocomplete="email" /></div>
        <div class="form-group">
          <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
          <div class="password-wrap"><input type="password" id="password" placeholder="Min 6 characters" required minlength="6" />
            <button type="button" class="pw-toggle" onclick="togglePw()"><i class="fa-solid fa-eye" id="pwIcon"></i></button></div>
        </div>
        <div class="form-group">
          <label for="role"><i class="fa-solid fa-id-badge"></i> Your Role</label>
          <select id="role">
            <option value="shopkeeper">🛍️ Shopkeeper</option>
            <option value="warehouse_manager">🏭 Warehouse Manager</option>
            <option value="delivery_manager">🚚 Delivery Manager</option>
            <option value="accountant">💰 Accountant</option>
            <option value="store_clerk">📋 Store Clerk</option>
            <option value="supervisor">👔 Supervisor</option>
            <option value="admin">⚙️ Admin</option>
            <option value="sales_executive">💼 Sales Executive</option>
            <option value="logistics_head">🚛 Logistics Head</option>
            <option value="inventory_auditor">🧐 Inventory Auditor</option>
          </select>
        </div>
        <button type="submit" class="btn-submit" id="registerBtn">
          <span class="btn-text">Create Account <i class="fa-solid fa-arrow-right"></i></span>
          <span class="btn-loader" style="display:none;"><i class="fa-solid fa-spinner fa-spin"></i> Creating...</span>
        </button>
      </form>
      <div class="auth-footer"><p>Already have an account? <a href="/login.html">Sign In</a></p></div>
    </div>
    <div class="auth-bottom-text"><p>&copy; 2026 PoCkEtWoRld</p></div>
  </div>

  <script>
    function togglePw(){const f=document.getElementById('password'),i=document.getElementById('pwIcon');f.type=f.type==='password'?'text':'password';i.className=f.type==='password'?'fa-solid fa-eye':'fa-solid fa-eye-slash';}
    document.getElementById('registerForm').addEventListener('submit', async e=>{
      e.preventDefault();const btn=document.getElementById('registerBtn');
      btn.querySelector('.btn-text').style.display='none';btn.querySelector('.btn-loader').style.display='inline-flex';
      document.getElementById('errorMsg').style.display='none';document.getElementById('successMsg').style.display='none';
      try{const res=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({name:document.getElementById('name').value,email:document.getElementById('email').value,
          password:document.getElementById('password').value,role:document.getElementById('role').value})});
        const data=await res.json();
        if(data.success){document.getElementById('successText').textContent=data.message;document.getElementById('successMsg').style.display='flex';
          btn.classList.add('success');btn.querySelector('.btn-text').textContent='✓ Created!';
          btn.querySelector('.btn-text').style.display='inline';btn.querySelector('.btn-loader').style.display='none';
          setTimeout(()=>window.location.href='/login.html',1200);
        }else{document.getElementById('errorText').textContent=data.error;document.getElementById('errorMsg').style.display='flex';
          btn.querySelector('.btn-text').style.display='inline';btn.querySelector('.btn-loader').style.display='none';}
      }catch(err){document.getElementById('errorText').textContent='Connection error.';document.getElementById('errorMsg').style.display='flex';
        btn.querySelector('.btn-text').style.display='inline';btn.querySelector('.btn-loader').style.display='none';}
    });
  </script>
</body>
</html>
