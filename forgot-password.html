<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PoCkEtWoRld — Forgot Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/assets/auth.css" />
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow glow-1"></div><div class="bg-glow glow-2"></div><div class="bg-glow glow-3"></div>

  <div class="auth-container">
    <div class="auth-logo">
      <div class="logo-globe">🌍</div>
      <span class="logo-text"><span class="p">P</span><span class="o1">o</span><span class="c">C</span><span class="k">k</span><span class="e1">E</span><span class="t">t</span><span class="w">W</span><span class="o2">o</span><span class="r">R</span><span class="l">l</span><span class="d">D</span></span>
    </div>

    <div class="auth-card">
      <!-- STEP 1: Enter Email -->
      <div id="step1">
        <div class="auth-header"><h1>Forgot Password?</h1><p>Enter your email to receive a reset OTP</p></div>
        <div id="err1" class="error-msg" style="display:none;"><i class="fa-solid fa-circle-exclamation"></i><span id="errT1"></span></div>
        <form id="emailForm" class="auth-form">
          <div class="form-group"><label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" /></div>
          <button type="submit" class="btn-submit" id="sendBtn">
            <span class="btn-text">Send Reset OTP <i class="fa-solid fa-paper-plane"></i></span>
            <span class="btn-loader" style="display:none;"><i class="fa-solid fa-spinner fa-spin"></i> Sending...</span>
          </button>
        </form>
      </div>

      <!-- STEP 2: Enter OTP + New Password -->
      <div id="step2" style="display:none;">
        <div class="auth-header"><h1>Reset Password</h1><p>Enter the OTP sent to <strong id="sentEmail"></strong></p></div>
        <div id="err2" class="error-msg" style="display:none;"><i class="fa-solid fa-circle-exclamation"></i><span id="errT2"></span></div>
        <div id="devBox" class="dev-otp-box" style="display:none;"><i class="fa-solid fa-flask"></i><span>Dev OTP: <strong id="devOtp"></strong></span></div>
        <div id="successMsg" class="success-msg" style="display:none;"><i class="fa-solid fa-circle-check"></i><span id="successText"></span></div>

        <form id="resetForm" class="auth-form">
          <div class="form-group"><label><i class="fa-solid fa-key"></i> Enter 6-digit OTP</label>
            <div class="otp-inputs" id="otpInputs">
              <input type="text" maxlength="1" class="otp-box" inputmode="numeric" />
              <input type="text" maxlength="1" class="otp-box" inputmode="numeric" />
              <input type="text" maxlength="1" class="otp-box" inputmode="numeric" />
              <input type="text" maxlength="1" class="otp-box" inputmode="numeric" />
              <input type="text" maxlength="1" class="otp-box" inputmode="numeric" />
              <input type="text" maxlength="1" class="otp-box" inputmode="numeric" />
            </div>
          </div>
          <div class="form-group"><label for="newPw"><i class="fa-solid fa-lock"></i> New Password</label>
            <div class="password-wrap"><input type="password" id="newPw" placeholder="Min 6 characters" required minlength="6" />
              <button type="button" class="pw-toggle" onclick="const f=document.getElementById('newPw'),i=document.getElementById('npIcon');f.type=f.type==='password'?'text':'password';i.className=f.type==='password'?'fa-solid fa-eye':'fa-solid fa-eye-slash';"><i class="fa-solid fa-eye" id="npIcon"></i></button>
            </div>
          </div>
          <button type="submit" class="btn-submit" id="resetBtn">
            <span class="btn-text">Reset Password</span>
            <span class="btn-loader" style="display:none;"><i class="fa-solid fa-spinner fa-spin"></i> Resetting...</span>
          </button>
        </form>
        <div style="text-align:center;margin-top:12px;">
          <button class="link-btn" onclick="document.getElementById('step2').style.display='none';document.getElementById('step1').style.display='block';"><i class="fa-solid fa-arrow-left"></i> Change email</button>
        </div>
      </div>

      <div class="auth-footer"><p>Remember your password? <a href="/login.html">Sign In</a></p></div>
    </div>
    <div class="auth-bottom-text"><p>&copy; 2026 PoCkEtWoRld</p></div>
  </div>

  <script>
    let currentEmail='';
    // OTP boxes
    document.querySelectorAll('.otp-box').forEach((b,i,boxes) => {
      b.addEventListener('input', () => { b.value=b.value.replace(/\D/g,''); if(b.value && i<boxes.length-1) boxes[i+1].focus(); });
      b.addEventListener('keydown', e => { if(e.key==='Backspace'&&!b.value&&i>0) boxes[i-1].focus(); });
      b.addEventListener('paste', e => { e.preventDefault(); const d=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);
        d.split('').forEach((ch,j)=>{if(boxes[j])boxes[j].value=ch;}); if(d.length>0) boxes[Math.min(d.length,boxes.length)-1].focus(); });
    });
    function getOTP() { return Array.from(document.querySelectorAll('.otp-box')).map(b=>b.value).join(''); }

    // Step 1: Send OTP
    document.getElementById('emailForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn=document.getElementById('sendBtn'); toggle(btn,true); hide('err1');
      try {
        const res = await fetch('/api/forgot-password', { method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({email:document.getElementById('email').value}) });
        const data = await res.json();
        if(data.success) {
          currentEmail=document.getElementById('email').value;
          document.getElementById('sentEmail').textContent=currentEmail;
          document.getElementById('step1').style.display='none';
          document.getElementById('step2').style.display='block';
          if(data.dev_otp) { document.getElementById('devOtp').textContent=data.dev_otp; document.getElementById('devBox').style.display='flex'; }
          document.querySelector('.otp-box').focus();
        } else { show('err1','errT1',data.error); }
      } catch(err) { show('err1','errT1','Connection error.'); }
      toggle(btn,false);
    });

    // Step 2: Reset Password
    document.getElementById('resetForm').addEventListener('submit', async e => {
      e.preventDefault();
      const otp=getOTP(); if(otp.length!==6) { show('err2','errT2','Enter all 6 digits.'); return; }
      const btn=document.getElementById('resetBtn'); toggle(btn,true); hide('err2');
      try {
        const res = await fetch('/api/reset-password', { method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({email:currentEmail, otp, newPassword:document.getElementById('newPw').value}) });
        const data = await res.json();
        if(data.success) {
          document.getElementById('successText').textContent=data.message;
          document.getElementById('successMsg').style.display='flex';
          btn.classList.add('success'); btn.querySelector('.btn-text').textContent='✓ Password Reset!'; toggle(btn,false);
          setTimeout(()=>window.location.href='/login.html', 1500);
        } else { show('err2','errT2',data.error); toggle(btn,false); }
      } catch(err) { show('err2','errT2','Connection error.'); toggle(btn,false); }
    });

    function toggle(btn,l){btn.querySelector('.btn-text').style.display=l?'none':'inline-flex';btn.querySelector('.btn-loader').style.display=l?'inline-flex':'none';}
    function show(dId,tId,m){document.getElementById(tId).textContent=m;document.getElementById(dId).style.display='flex';}
    function hide(id){document.getElementById(id).style.display='none';}
  </script>
</body>
</html>
